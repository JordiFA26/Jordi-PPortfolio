<!doctype html>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#12151C" />
    <script>
      // Apply the saved theme before first paint (default: dark).
      try {
        var t = localStorage.getItem('theme')
        document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark'
      } catch (e) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
    <title>Jordi Facha Álvarez — Engineering Student &amp; Podcaster</title>
    <meta name="description" content="Jordi Facha Álvarez — Automotive &amp; Industrial Engineering student at Universidad Francisco de Vitoria (Madrid) and host of the Inside The Machine motorsport podcast." />
